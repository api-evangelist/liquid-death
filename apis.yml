apis:
- name: Liquid Death UCP Shopping MCP
  description: >-
    Liquid Death's hosted Model Context Protocol server implementing the Universal Commerce Protocol dev.ucp.shopping
    service — catalog search and lookup, cart, checkout, fulfillment, discount and order. Advertised in
    robots.txt, agents.md and the /.well-known/ucp merchant profile. Requires a resolvable UCP agent profile,
    mandates an Idempotency-Key on complete_checkout, cancel_checkout and cancel_cart, and forbids completing
    payment without explicit buyer approval.
  humanURL: https://liquiddeath.com/agents.md
  baseURL: https://liquiddeath.myshopify.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Universal Commerce Protocol
  - E-Commerce
  tags_raw:
  - Agentic Commerce
  - MCP
  - Universal Commerce Protocol
  - Ecommerce
  properties:
  - type: Documentation
    url: https://liquiddeath.com/agents.md
  - type: MCPServer
    url: mcp/liquid-death-mcp.yml
  - type: ToolCrosswalk
    url: mcp/liquid-death-tool-crosswalk.yml
  - type: OpenRPC
    url: mcp/liquid-death-ucp-shopping-mcp.openrpc.json
- name: Liquid Death Customer Account OAuth
  description: >-
    The OpenID Connect and OAuth 2.0 authorization server for the Liquid Death customer account, hosted
    at account.liquiddeath.com and discoverable from both /.well-known/openid-configuration and /.well-known/oauth-authorization-server.
    Authorization code flow with PKCE (S256); advertises the customer-account-api:full and customer-account-mcp-api:full
    scopes.
  humanURL: https://liquiddeath.com/.well-known/openid-configuration
  baseURL: https://account.liquiddeath.com/authentication
