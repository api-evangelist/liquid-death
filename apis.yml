aid: liquid-death
name: Liquid Death
description: >-
  Liquid Death is a Los Angeles beverage company founded in 2014 by Mike Cessario, Pat Cook and JonRyan
  Riggins, selling still and sparkling mountain water, iced tea, flavored sparkling water, the Death Dust
  electrolyte powder and a Sparkling Energy line, all in recyclable aluminum tallboys and marketed through
  a deliberately horror-comedy brand voice. It has raised roughly $264M and was valued at $1.4B in its 2024
  Series F. Liquid Death publishes no conventional developer portal, yet it is one of the more
  agent-forward direct-to-consumer storefronts in the catalog: liquiddeath.com serves a first-party
  agents.md (mirrored at /llms.txt), a dedicated agentic-discovery sitemap, an agent policy block inside
  robots.txt, a Universal Commerce Protocol merchant profile at /.well-known/ucp, a live UCP shopping MCP
  endpoint, and both OpenID Connect and RFC 8414 OAuth discovery documents for its customer account. The
  storefront exposes an anonymous read-only product and collection JSON surface, while every cart,
  checkout and order capability is confined to the identity-gated, idempotency-keyed MCP transport that
  requires contemporaneous human approval before payment.
